<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 32" width="36" height="32">
  <!--
    PlausibleBA Favicon — simplified chevron pentagon for small sizes
  -->

  <!-- Pentagon shape -->
  <path d="
    M 5,1
    L 21,1
    L 35,16
    L 21,31
    L 5,31
    Q 1,31 1,27
    L 1,5
    Q 1,1 5,1
    Z
  " fill="#242A41"/>

  <!-- Thick chevron -->
  <path d="M 15,3 L 33,16 L 15,29 L 23,29 L 35,16 L 23,3 Z" fill="#6AC3EE"/>

  <!-- 2x2 grid -->
  <rect x="4" y="6" width="5.5" height="5.5" rx="1" fill="#FFFFFF"/>
  <rect x="11" y="6" width="5.5" height="5.5" rx="1" fill="#FFFFFF"/>
  <rect x="4" y="13" width="5.5" height="5.5" rx="1" fill="#6AC3EE"/>
  <rect x="11" y="13" width="5.5" height="5.5" rx="1" fill="#FFFFFF"/>

  <!-- Label bar -->
  <rect x="4" y="21" width="12.5" height="4.5" rx="1" fill="#FFFFFF" opacity="0.38"/>
</svg>
